function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function hit(name, q) {
var n = norm(name);
if (n.indexOf(q) === 0) return true;
return n.split(/[\s\-()'.,]+/).some(function (w) { return w && w.indexOf(q) === 0; });
}
function options(name, raw) {
var q = norm(String(raw || "").trim()), out = [];
if (name === "country") {
COUNTRIES.map(function (c) { return { c: c, n: countryName(c.iso) }; })
.sort(function (a, b) { return a.n.localeCompare(b.n, S.lang); })
.forEach(function (x) { if (!q || hit(x.n, q) || hit(x.c.en, q)) out.push({ v: x.c.iso, iso: x.c.iso, label: x.n, sub: "" }); });
if (q) COUNTRIES.forEach(function (c) {
c.cities.forEach(function (x) { if (hit(x[0], q) || norm(x[1]) === q) out.push({ v: c.iso + ":" + x[1], iso: c.iso, label: x[0], sub: countryName(c.iso) }); });
});
} else if (name === "origin") {
var codes = ORIGIN_TOP.concat(Object.keys(CITY).filter(function (c) { return ORIGIN_TOP.indexOf(c) < 0; }).sort(function (a, b) { return CITY[a].name.localeCompare(CITY[b].name); }));
var first = [], rest = [];
codes.forEach(function (code) {
var c = CITY[code];
if (!q) { first.push(c); return; }
if (hit(c.name, q) || norm(code) === q) first.push(c);
else if (hit(countryName(c.iso), q) || hit(BY_ISO[c.iso].en, q)) rest.push(c);
});
first.concat(rest).forEach(function (c) { out.push({ v: c.code, iso: c.iso, label: c.name, sub: c.code }); });
} else if (name === "lang") {
LANGS.forEach(function (code) {
var nat = langName(code, code), en = langName(code, "en");
if (!q || hit(nat, q) || hit(en, q) || norm(code) === q) out.push({ v: code, label: nat, sub: en === nat ? "" : en });
});
} else if (name === "currency") {
Object.keys(CURRENCIES).forEach(function (code) {
var nm = curName(code), enName = CRYPTO[code] ? CRYPTO[code][0] : (function () { try { return new Intl.DisplayNames(["en"], { type: "currency" }).of(code); } catch (e) { return code; } })();
if (!q || norm(code).indexOf(q) === 0 || hit(nm, q) || hit(enName, q) || norm(curSymbol(code)) === q) out.push({ v: code, label: code + " · " + nm, sub: curSymbol(code) });
});
}
return out.slice(0, 100);
}

'<div style="position:absolute;left:162px;top:112px;height:34px;padding:0 10px;border-radius:17px;background:var(--ink);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;border:3px solid #fff">' + esc(t("yourHotel")) + "</div>" +
pins.map(function (p) { return '<button class="pin' + (p.i === S.deal ? " on" : "") + '" style="left:' + p.x + "px;top:" + p.y + 'px" data-act="deal" data-v="' + p.i + '" aria-label="' + esc(t(p.tk)) + '">' + p.d + "</button>"; }).join("") +
'<span class="preview">' + esc(t("preview")) + "</span></div>";
var d = PINS[S.deal];
if (d) {
h += '<div class="card" style="gap:12px"><div style="display:flex;align-items:center;gap:12px"><div style="flex:none;width:56px;height:56px;border-radius:14px;background:#FFE4DA;color:#B23A17;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center">' + d.d + "</div>" +
'<div><div style="font-size:16px;font-weight:900">' + esc(t(d.tk)) + '</div><div class="hint">' + esc(t(d.mk)) + " · " + d.km + " km</div></div></div>" +
'<button class="btn ghost" data-act="soon">' + esc(t("vouchersSoon")) + "</button></div>";
}
h += '<section class="card"><div class="h">' + esc(t("thingsNow")) + '</div><div class="grid2">' +
'<button class="btn" data-act="open" data-v="' + LINKS.tours + '">' + esc(t("ticketsTours")) + '</button><button class="btn ghost" data-act="open" data-v="' + LINKS.audio + '">' + esc(t("audioGuides")) + "</button></div></section>";
h += '<div class="fine">' + esc(t("mapFine")) + "</div>";
return h;
}
function screenProfile() {
var h = '<section class="card"><div style="display:flex;flex-direction:column;gap:6px"><div class="label">' + esc(t("language")) + "</div>" + combo("lang", t("typeLang")) + "</div>";
if (!TR[S.lang]) h += '<div class="hint">' + esc(t("langNote")) + "</div>";
h += '<div style="display:flex;flex-direction:column;gap:6px"><div class="label">' + esc(t("currency")) + "</div>" + combo("currency", t("typeCurrency")) + "</div></section>";
h += '<section class="card" style="background:var(--blue);color:#fff"><div class="h">' + esc(t("together")) + "</div>" +
'<div style="font-size:13px;color:#D8ECFB">' + esc(t("togetherText")) + '</div><button class="cta" data-act="invite">' + esc(t("invite")) + "</button></section>";
h += '<section class="card"><div class="row"><div class="h">' + esc(t("badges")) + '</div><div class="hint" style="font-weight:700">' + esc(t("soon")) + '</div></div><div class="grid3">' +
["b1","b2","b3","b4","b5","b6"].map(function (b) { return '<div class="badge"><i></i>' + esc(t(b)) + "</div>"; }).join("") + "</div></section>";
return h;
}
function render() {
document.getElementById("subtitle").textContent = t("sub_" + S.tab);
document.getElementById("curcode").textContent = curSymbol(S.currency) === S.currency ? S.currency : curSymbol(S.currency) + " " + S.currency;
document.getElementById("cur").setAttribute("aria-label", t("currency") + ": " + S.currency);
document.getElementById("langcode").textContent = "🌐 " + S.lang.toUpperCase();
document.getElementById("langbtn").setAttribute("aria-label", t("language") + ": " + langName(S.lang, S.lang));
var main = document.getElementById("main"), y = main.scrollTop;
main.innerHTML = S.tab === "search" ? screenSearch() : S.tab === "coupons" ? screenCoupons() : S.tab === "map" ? screenMap() : screenProfile();
main.scrollTop = y;
document.getElementById("nav").innerHTML = TABS.map(function (k) {
return '<button class="' + (S.tab === k ? "on" : "") + '" data-act="tab" data-v="' + k + '">' + svg(ICON[k], 22) + "<span>" + esc(t("tab_" + k)) + "</span></button>";
}).join("");
}

// ---------- Events ----------
function act(el) {
var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
switch (a) {
case "tab": S.tab = v; haptic(); document.getElementById("main").scrollTop = 0; break;
case "cat": S.cat = v; S.searched = false; haptic(); break;
case "country": S.country = v; S.city = BY_ISO[v].cities[0][1]; S.searched = false; haptic(); break;
case "when": S.when = v; S.searched = false; haptic(); break;
case "calnav": S.calM = (S.calM || 0) + Number(v); break;
case "calday":
if (!S.from || S.to || v < S.from) { S.from = v; S.to = ""; } else { S.to = v; }
S.searched = false; haptic(); break;
case "adults": S.adults = Math.min(9, Math.max(1, S.adults + Number(v))); haptic(); break;
case "kids": if (Number(v) > 0 && S.kids.length < 6) S.kids.push(7); else if (Number(v) < 0) S.kids.pop(); haptic(); break;
case "search":
if (S.when === "pick" && (!S.from || !S.to || S.to < S.from)) { toast(t("datesToast")); return; }
S.searched = true; haptic(); render();
setTimeout(function () { var r = document.querySelector(".result, .soon"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
return;
case "open": openLink(v); return;
case "watch": toast(t("watchToast2")); setTimeout(function () { openLink(v); }, 700); return;
case "wmode": S.wmode = v; save("wmode", v); haptic(); break;
case "soon": toast(t("voucherToast")); return;
case "spin":
S.rotation += 1440 + Math.floor(Math.random() * 360);
var w = document.getElementById("wheel"); if (w) w.style.transform = "rotate(" + S.rotation + "deg)";
haptic();
setTimeout(function () {
S.wheel = spinWheel();
try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
render();
}, 2400);
return;
case "curopen": haptic(); openSheet(); return;
case "langopen": haptic(); openSheet("lang"); return;
case "curclose": closeSheet(); return;
case "filter": S.filter = v; break;
case "deal": S.deal = Number(v); haptic(); break;
case "currency": S.currency = v; save("currency", v); haptic(); break;
case "invite":
openLink("https://t.me/share/url?url=" + encodeURIComponent(BOT_LINK) + "&text=" + encodeURIComponent(t("inviteText")));
return;
default: return;
}
render();
}
function change(el) {
var a = el.getAttribute("data-act");
if (a === "city") { S.city = el.value; S.searched = false; }
else if (a === "from") { S.from = el.value; S.searched = false; }
else if (a === "to") { S.to = el.value; S.searched = false; }
else if (a === "kidage") { S.kids[Number(el.getAttribute("data-i"))] = Number(el.value); S.searched = false; }
else if (a === "budget") { S.budget = Number(el.value); save("budget", S.budget); S.wheel = null; }
else return;
render();
}
document.addEventListener("click", function (e) {
var p = e.target.closest("[data-pick]");
if (p) { pick(p.getAttribute("data-pick"), p.getAttribute("data-v")); return; }
var el = e.target.closest("button[data-act]");
if (el) act(el);
});
function keepFocus(e) { if (e.target.closest && e.target.closest(".dd")) e.preventDefault(); }
document.addEventListener("mousedown", keepFocus);
document.addEventListener("focusin", function (e) {
var inp = e.target;
if (!inp.matches || !inp.matches("[data-cin]")) return;
openDD(inp, "");
try { inp.select(); } catch (err) {}
var box = inp.closest(".combo");
setTimeout(function () { if (document.activeElement === inp) box.scrollIntoView({ block: "start", behavior: "smooth" }); }, 300);
});
document.addEventListener("focusout", function (e) {
var inp = e.target;
if (!inp.matches || !inp.matches("[data-cin]")) return;
setTimeout(function () {
if (document.activeElement === inp || !inp.isConnected) return;
if (inp.closest("#sheet")) { closeSheet(); return; }
var box = inp.closest(".combo"); box.querySelector(".dd").hidden = true;
inp.value = comboLabel(inp.getAttribute("data-cin"));
}, 150);
});
document.addEventListener("keydown", function (e) {
var inp = e.target;
if (!inp.matches || !inp.matches("[data-cin]")) return;
var box = inp.closest(".combo");
if (e.key === "ArrowDown") { e.preventDefault(); moveAct(box, 1); }
else if (e.key === "ArrowUp") { e.preventDefault(); moveAct(box, -1); }
else if (e.key === "Enter") {
e.preventDefault();
var items = box._items || [], i = box._act >= 0 ? box._act : 0;
if (items[i]) pick(inp.getAttribute("data-cin"), items[i].v);
} else if (e.key === "Escape") { inp.blur(); }
});
document.addEventListener("change", function (e) {
if (e.target.matches("[data-act]")) change(e.target);
});
document.addEventListener("input", function (e) {
var el = e.target;
if (el.matches("[data-cin]")) { openDD(el, el.value); return; }
if (el.matches('input[type=range][data-act="budget"]')) {
S.budget = Number(el.value);
var hub = document.querySelector(".hub b"); if (hub) hub.textContent = money(S.budget);
}
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !document.getElementById("sheet").hidden) closeSheet(); });
window.__tripwise = { state: S, flightUrl: flightUrl, passengers: passengers, tripDates: tripDates, options: options, TR: TR, KEYS: KEYS, COUNTRIES: COUNTRIES, money: money, spinWheel: spinWheel, setData: function (p, r) { if (p) PRICES = p; if (r) Object.keys(r).forEach(function (k) { if (CURRENCIES[k] !== undefined) RATES[k] = r[k]; }); render(); } };
render();
// Fresh exchange rates and flight prices, updated by GitHub Actions (see .github/workflows/prices.yml)
function loadJSON(path) { return fetch(path + "?v=" + Math.floor(Date.now() / 600000), { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
loadJSON("data/rates.json").then(function (d) { window.__tripwise.setData(null, d.rates); }).catch(function () {});
loadJSON("data/prices.json").then(function (d) { PRICES = d; }).catch(function () {});
loadJSON("data/tours.json").then(function (d) { TOURS = d || {}; }).catch(function () {});
loadJSON("data/links.json").then(function (d) { PLINKS = d || {}; applyLinks(); render(); }).catch(function () {});
})();
</script>
</body>
