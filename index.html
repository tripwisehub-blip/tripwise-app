<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tripwise</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
--blue: #0A6FC0; --blue-soft: #E2F0FC; --sun: #FFC845; --coral: #FF7A50; --mint: #2BB79F;
--sky: #BFE3F7; --sand: #FFE9C2; --ink: #1B2B3A; --muted: #5C7083; --line: #CFE0EF; --bg: #F2F8FE;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, -apple-system, sans-serif; }
button, select, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
header { padding: 16px 18px 14px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: space-between; }
header .t { font-size: 22px; font-weight: 900; }
header .s { font-size: 13px; font-weight: 600; color: #D8ECFB; }
.pill { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--sun); color: var(--ink); font-size: 13px; font-weight: 800; display: flex; align-items: center; }
main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.card { background: #fff; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.h { font-size: 17px; font-weight: 900; }
.label { font-size: 13px; font-weight: 800; color: #4A5E70; }
.hint { font-size: 12px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chip { min-height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 13px; font-weight: 800; padding: 0 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.cat { min-height: 62px; flex-direction: column; gap: 4px; font-size: 12px; }
.country { min-height: 38px; font-size: 12px; justify-content: flex-start; padding: 0 8px; }
.country span.n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { position: relative; flex: none; width: 20px; height: 14px; border-radius: 3px; overflow: hidden; display: flex; box-shadow: 0 0 0 1px rgba(27,43,58,.15); }
select, input[type=date] { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 10px; font-size: 15px; font-weight: 700; background: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--line); background: #fff; font-size: 20px; font-weight: 800; color: var(--blue); }
.stepper button.plus { border: 0; background: var(--blue-soft); }
.stepper .v { width: 22px; text-align: center; font-size: 17px; font-weight: 900; }
.cta { height: 54px; border: 0; border-radius: 16px; background: var(--sun); font-size: 17px; font-weight: 900; color: var(--ink); width: 100%; }
.btn { height: 42px; border-radius: 12px; border: 0; background: var(--blue); color: #fff; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; }
.btn.ghost { background: #fff; border: 1.5px solid var(--line); color: var(--blue); }
.result { background: #fff; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.result .band { height: 52px; padding: 10px 12px; display: flex; align-items: flex-start; }
.tag { height: 24px; padding: 0 10px; border-radius: 12px; background: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; }
.result .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.soon { border-radius: 16px; background: var(--sand); padding: 12px 14px; font-size: 13px; font-weight: 700; color: #6B4A00; }
nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #fff; border-top: 1px solid #DCE8F3; padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); }
nav button { border: 0; border-radius: 14px; min-height: 52px; background: transparent; color: #62778A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 800; }
nav button.on { background: var(--blue-soft); color: var(--blue); }
.wheel-wrap { position: relative; width: 230px; height: 230px; align-self: center; }
.wheel { position: absolute; inset: 0; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 0 2px var(--blue-soft); transition: transform 2.4s cubic-bezier(.15,.8,.15,1);
background: conic-gradient(var(--blue) 0 60deg, var(--sun) 60deg 120deg, var(--coral) 120deg 180deg, var(--mint) 180deg 240deg, var(--sky) 240deg 300deg, var(--sand) 300deg 360deg); }
.pointer { position: absolute; left: 106px; top: -8px; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 20px solid var(--ink); }
.hub { position: absolute; left: 70px; top: 70px; width: 90px; height: 90px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hub b { font-size: 22px; font-weight: 900; }
input[type=range] { width: 100%; accent-color: var(--blue); }
.win { border-radius: 16px; background: #DDF6F1; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.map { position: relative; height: 280px; border-radius: 20px; overflow: hidden; background: #DCEFE4; }
.map .road { position: absolute; background: #fff; }
.pin { position: absolute; height: 32px; padding: 0 10px; border-radius: 16px; border: 3px solid #fff; font-size: 13px; font-weight: 900; background: var(--sun); color: var(--ink); }
.pin.on { background: #D9481F; color: #fff; }
.preview { position: absolute; right: 10px; top: 10px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; }
.badge { border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: #F2F6FA; color: #62778A; font-size: 12px; font-weight: 800; }
.badge i { width: 34px; height: 34px; border-radius: 50%; background: #DCE5EE; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); max-width: 340px; width: calc(100% - 40px); background: var(--ink); color: #fff; padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }
.fine { font-size: 11px; color: var(--muted); padding: 0 4px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
<div><div class="t">Tripwise</div><div class="s" id="subtitle">Where are we going?</div></div>
<div class="pill" id="cur">EUR</div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

};

var WHEEL_CITIES = [["Riga","RIX"],["Vilnius","VNO"],["Krakow","KRK"],["Prague","PRG"],["Budapest","BUD"],["Gdansk","GDN"],["Copenhagen","CPH"],["Vienna","VIE"]];
var PINS = [
{ cat: "food", title: "Dinner for two", meta: "Restaurant · 0.3 km", d: "-40%", x: 40, y: 160 },
{ cat: "food", title: "Brunch & coffee", meta: "Cafe · 0.5 km", d: "-30%", x: 240, y: 130 },
{ cat: "spa", title: "Day spa with sauna", meta: "Spa · 0.6 km", d: "-35%", x: 220, y: 230 },
{ cat: "beauty", title: "Manicure + massage", meta: "Beauty salon · 0.8 km", d: "-50%", x: 60, y: 50 },
{ cat: "fun", title: "Escape room for 4", meta: "Entertainment · 1.1 km", d: "-25%", x: 100, y: 235 }
];
function load(key, fallback) {
try { var v = localStorage.getItem("tw_" + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, value) { try { localStorage.setItem("tw_" + key, JSON.stringify(value)); } catch (e) {} }
var S = {
tab: "search", cat: "flights", origin: load("origin", "TLL"), country: 7, city: "BCN",
when: "weekend", from: "", to: "", adults: 2, kids: [], searched: false,
budget: 150, rotation: 0, wheelCity: null, filter: "all", deal: 0,
lang: load("lang", "English"), currency: load("currency", "EUR")
};
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
try { tg.ready(); tg.expand(); tg.setHeaderColor("#0A6FC0"); tg.setBackgroundColor("#F2F8FE"); } catch (e) {}
}
function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
function openLink(url) {
haptic();
if (tg && tg.openTelegramLink && url.indexOf("https://t.me/") === 0) tg.openTelegramLink(url);
else if (tg && tg.openLink) tg.openLink(url);
else window.open(url, "_blank", "noopener");
}
function toast(text) {
var t = document.getElementById("toast");
t.textContent = text; t.classList.add("show");
clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function svg(path, size) {
return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"></path></svg>';
}
function flag(c) {
var h = '<span class="flag" style="flex-direction:' + c.dir + '">';
c.st.forEach(function (s) { h += '<span style="flex:' + s[1] + ';background:' + s[0] + '"></span>'; });
if (c.cross) h += '<span style="position:absolute;top:0;bottom:0;left:6px;width:3px;background:' + c.cross + '"></span><span style="position:absolute;left:0;right:0;top:5.5px;height:3px;background:' + c.cross + '"></span>';
if (c.dot) h += '<span style="position:absolute;left:6px;top:3px;width:8px;height:8px;border-radius:4px;background:' + c.dot + '"></span>';
return h + "</span>";
}
function sym() { return { EUR: "€", USD: "$", GBP: "£", USDT: "₮", BTC: "₿" }[S.currency] || "€"; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function ddmm(d) { return pad(d.getDate()) + pad(d.getMonth() + 1); }
function nextWeekday(day) { // 0=Sun..6=Sat, strictly in the future
var d = new Date(); d.setHours(12, 0, 0, 0);
var diff = (day - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff); return d;
}
function tripDates() {
if (S.when === "pick" && S.from && S.to) return [new Date(S.from + "T12:00:00"), new Date(S.to + "T12:00:00")];
if (S.when === "next") { var m = nextWeekday(1); var e = new Date(m); e.setDate(m.getDate() + 6); return [m, e]; }
var f = nextWeekday(5); var s = new Date(f); s.setDate(f.getDate() + 2); return [f, s];
}
function passengers() {
var children = S.kids.filter(function (a) { return a >= 2; }).length;
var infants = S.kids.filter(function (a) { return a < 2; }).length;
return String(S.adults) + (children || infants ? String(children) + (infants ? String(infants) : "") : "");
}
function flightUrl(dest) {
var d = tripDates();
var path = S.origin + ddmm(d[0]) + dest + ddmm(d[1]) + passengers();
return "https://www.aviasales.com/search/" + path + "?marker=" + MARKER + ".miniapp";
}
function cityName() {

}).join("") + "</div>";

ORIGINS.map(function (o) { return '<option value="' + o[1] + '"' + (S.origin === o[1] ? " selected" : "") + ">" + o[0] + "</option>"; }).join("") + "</select></label>";
}
h += '<div style="display:flex;flex-direction:column;gap:8px"><div class="label">Where to?</div><div class="grid3">' +
COUNTRIES.map(function (x, i) {

}).join("") + "</div>";
h += '<label class="label" style="display:flex;align-items:center;gap:10px">City<select data-act="city" style="flex:1">' +
c.cities.map(function (x) { return '<option value="' + x[1] + '"' + (S.city === x[1] ? " selected" : "") + ">" + x[0] + "</option>"; }).join("") + "</select></label></div>";
h += '<div style="display:flex;flex-direction:column;gap:8px"><div class="label">When</div><div class="grid3">' +
[["weekend","Weekend"],["next","Next week"],["pick","Pick dates"]].map(function (w) {
return '<button class="chip' + (S.when === w[0] ? " on" : "") + '" data-act="when" data-v="' + w[0] + '">' + w[1] + "</button>";

h += '<div class="hint">' + fmt(d[0]) + " – " + fmt(d[1]) + "</div>";
}
h += "</div>";
h += '<div style="display:flex;flex-direction:column;gap:10px"><div class="label">Who\'s travelling</div>';

function resultCard(band, tag, title, text, button, act, extra) {

function results() {

h += resultCard("var(--sand)", "Things to do", "Tickets and tours in " + esc(city), "Museums, attractions, skip-the-line", "See tours", LINKS.tours);
} else if (S.cat === "car") {
h += resultCard("var(--sky)", "Best value", "Car rental in " + esc(city), "Local companies, free cancellation on many cars", "Find a car", LINKS.car);
h += resultCard("var(--sand)", "More choice", "Compare more rental companies", "International and local brands", "Compare", LINKS.car2);
} else if (S.cat === "tours") {
h += resultCard("var(--sky)", "Top rated", "Tickets and tours in " + esc(city), "Museums, attractions, day trips", "See tours", LINKS.tours);
h += resultCard("var(--sand)", "Self-guided", "Audio guides for " + esc(city), "Explore at your own pace", "Audio tours", LINKS.audio);
} else if (S.cat === "transfer") {
h += resultCard("var(--sky)", "Fixed price", "Airport transfer in " + esc(city), "Meet & greet, child seats on request", "Book transfer", LINKS.transfer);
h += resultCard("var(--sand)", "Drive yourself", "Car rental in " + esc(city), "Pick up at the airport", "Find a car", LINKS.car);
} else {
h += resultCard("var(--sky)", "Instant", "eSIM for " + esc(COUNTRIES[S.country].name), "Install in minutes, no roaming bills", "Get eSIM", LINKS.esim);
}
h += '<div class="fine">Some links are affiliate links — your price stays the same.</div></section>';
return h;
}
function screenCoupons() {
var h = '<section class="card" style="align-items:stretch">';
h += '<div><div class="h">Stingy Traveler wheel</div><div class="hint">Set a budget, spin — we pick a weekend city and open live flight prices.</div></div>';
h += '<div class="wheel-wrap"><div class="wheel" id="wheel" style="transform:rotate(' + S.rotation + 'deg)"></div><div class="pointer"></div>' +
'<div class="hub"><span class="hint" style="font-weight:800">budget</span><b>' + sym() + S.budget + "</b></div></div>";
h += '<input type="range" min="50" max="500" step="10" value="' + S.budget + '" data-act="budget" aria-label="Budget per person">';
h += '<button class="cta" data-act="spin">Spin the wheel</button>';
if (S.wheelCity) {
var w = S.wheelCity;
h += '<div class="win"><div><div style="font-size:12px;font-weight:800;color:#0B6E60">The wheel says…</div>' +
'<div style="font-size:18px;font-weight:900">Weekend in ' + w[0] + '</div><div class="hint" style="color:#3D5568">Flights from ' + esc(originName()) + ", this weekend. Pick the ones within " + sym() + S.budget + ".</div></div>" +
'<button class="btn" data-act="open" data-v="' + esc(flightUrlTo(w[1])) + '">Show flights to ' + w[0] + "</button></div>";
}
h += "</section>";
h += '<section class="card"><div class="h">Error fares feed</div><div class="soon">Coming soon: airline pricing mistakes and flash deals, caught for you in real time.</div>' +
'<div class="hint">Want to be first? Keep the bot chat open — we will message you when it launches.</div></section>';
h += '<section class="card"><div class="h">Flight delayed or cancelled?</div><div class="hint">You may be owed up to €600 under EU rules.</div>' +
'<button class="btn" data-act="open" data-v="' + LINKS.delay + '">Check compensation</button></section>';
return h;
}
function originName() { var o = ORIGINS.filter(function (x) { return x[1] === S.origin; })[0]; return o ? o[0] : "Tallinn"; }
function flightUrlTo(code) {
var keep = S.when; S.when = "weekend"; var u = flightUrl(code); S.when = keep; return u;
}
function screenMap() {
var pins = PINS.map(function (p, i) { p.i = i; return p; }).filter(function (p) { return S.filter === "all" || p.cat === S.filter; });
if (!pins.some(function (p) { return p.i === S.deal; }) && pins[0]) S.deal = pins[0].i;
var h = '<div style="border-radius:16px;background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px">' +
'<span style="color:var(--sun)">' + svg(ICON.bell) + '</span><div style="font-size:13px;font-weight:700">After you book a hotel, I activate a discount map around it.</div></div>';
h += '<div style="display:flex;gap:6px;overflow-x:auto">' + [["all","All"],["food","Food"],["spa","Spa"],["beauty","Beauty"],["fun","Fun"]].map(function (f) {
return '<button class="chip' + (S.filter === f[0] ? " on" : "") + '" style="flex:none;padding:0 14px" data-act="filter" data-v="' + f[0] + '">' + f[1] + "</button>";
}).join("") + "</div>";
h += '<div class="map"><div class="road" style="left:0;top:0;width:140px;height:110px;background:var(--sky)"></div>' +
'<div class="road" style="left:0;right:0;top:122px;height:16px"></div><div class="road" style="top:0;bottom:0;left:180px;width:14px"></div>' +
'<div class="road" style="left:0;right:0;top:220px;height:10px"></div>' +
'<div style="position:absolute;left:162px;top:112px;height:34px;padding:0 10px;border-radius:17px;background:var(--ink);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;border:3px solid #fff">Your hotel</div>' +
pins.map(function (p) { return '<button class="pin' + (p.i === S.deal ? " on" : "") + '" style="left:' + p.x + "px;top:" + p.y + 'px" data-act="deal" data-v="' + p.i + '" aria-label="' + p.title + '">' + p.d + "</button>"; }).join("") +
'<span class="preview">Preview</span></div>';
var d = PINS[S.deal];
if (d) {
h += '<div class="card" style="gap:12px"><div style="display:flex;align-items:center;gap:12px"><div style="width:56px;height:56px;border-radius:14px;background:#FFE4DA;color:#B23A17;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center">' + d.d + "</div>" +
'<div><div style="font-size:16px;font-weight:900">' + d.title + '</div><div class="hint">' + d.meta + "</div></div></div>" +
'<button class="btn ghost" data-act="soon">Vouchers coming soon</button></div>';
}
h += '<section class="card"><div class="h">Things to do there now</div><div class="grid2">' +
'<button class="btn" data-act="open" data-v="' + LINKS.tours + '">Tickets & tours</button><button class="btn ghost" data-act="open" data-v="' + LINKS.audio + '">Audio guides</button></div></section>';
h += '<div class="fine">The map shows a preview. Live coupons arrive with partner networks.</div>';
return h;
}
function screenProfile() {
var langs = ["English", "Suomi", "Eesti", "Latviešu", "Deutsch", "Español", "Français"];
var h = '<section class="card"><label class="label" style="display:flex;flex-direction:column;gap:6px">Language<select data-act="lang">' +
langs.map(function (l) { return "<option" + (S.lang === l ? " selected" : "") + ">" + l + "</option>"; }).join("") + "</select></label>";
if (S.lang !== "English") h += '<div class="hint">The bot chat already answers in ' + esc(S.lang) + ". App translations are on the way.</div>";
h += '<div style="display:flex;flex-direction:column;gap:6px"><div class="label">Currency</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">' +
["EUR","USD","GBP","USDT","BTC"].map(function (c) { return '<button class="chip' + (S.currency === c ? " on" : "") + '" style="font-size:12px;padding:0 4px" data-act="currency" data-v="' + c + '">' + c + "</button>"; }).join("") + "</div></div></section>";
h += '<section class="card" style="background:var(--blue);color:#fff"><div class="h">Travel together</div>' +
'<div style="font-size:13px;color:#D8ECFB">Invite friends to Tripwise and plan the trip together.</div><button class="cta" data-act="invite">Invite friends</button></section>';
h += '<section class="card"><div class="row"><div class="h">Badges</div><div class="hint" style="font-weight:700">coming soon</div></div><div class="grid3">' +
["First trip","Deal hunter","Asia explorer","Bug hunter","5 countries","Night owl"].map(function (b) { return '<div class="badge"><i></i>' + b + "</div>"; }).join("") + "</div></section>";
return h;
}
function render() {
var tab = TABS.filter(function (t) { return t[0] === S.tab; })[0];
document.getElementById("subtitle").textContent = tab[2];
document.getElementById("cur").textContent = S.currency;
var main = document.getElementById("main"), y = main.scrollTop;
main.innerHTML = S.tab === "search" ? screenSearch() : S.tab === "coupons" ? screenCoupons() : S.tab === "map" ? screenMap() : screenProfile();
main.scrollTop = y;
document.getElementById("nav").innerHTML = TABS.map(function (t) {
return '<button class="' + (S.tab === t[0] ? "on" : "") + '" data-act="tab" data-v="' + t[0] + '">' + svg(ICON[t[0]], 22) + "<span>" + t[1] + "</span></button>";
}).join("");
}
function act(el) {
var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
switch (a) {
case "tab": S.tab = v; haptic(); document.getElementById("main").scrollTop = 0; break;
case "cat": S.cat = v; S.searched = false; haptic(); break;
case "country": S.country = Number(v); S.city = COUNTRIES[S.country].cities[0][1]; S.searched = false; haptic(); break;
case "when": S.when = v; S.searched = false; haptic(); break;
case "adults": S.adults = Math.min(9, Math.max(1, S.adults + Number(v))); haptic(); break;
case "kids": if (Number(v) > 0 && S.kids.length < 6) S.kids.push(7); else if (Number(v) < 0) S.kids.pop(); haptic(); break;
case "search":
if (S.when === "pick" && (!S.from || !S.to || S.to < S.from)) { toast("Please pick valid travel dates"); return; }
S.searched = true; haptic(); render();
setTimeout(function () { var r = document.querySelector(".result, .soon"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
return;
case "open": openLink(v); return;
case "watch": toast("Price alerts are coming soon — we'll message you in the chat."); return;
case "soon": toast("Vouchers are coming soon."); return;
case "spin":
S.rotation += 1440 + Math.floor(Math.random() * 360);
var w = document.getElementById("wheel"); if (w) w.style.transform = "rotate(" + S.rotation + "deg)";
haptic();
setTimeout(function () {
S.wheelCity = WHEEL_CITIES[Math.floor(Math.random() * WHEEL_CITIES.length)];
try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
render();
}, 2400);
return;
case "filter": S.filter = v; break;
case "deal": S.deal = Number(v); haptic(); break;
case "currency": S.currency = v; save("currency", v); haptic(); break;
case "invite":
openLink("https://t.me/share/url?url=" + encodeURIComponent(BOT_LINK) + "&text=" + encodeURIComponent("Planning a trip? Tripwise finds good-value flights, cars, tours and more."));
return;
default: return;
}
render();
}
function change(el) {
var a = el.getAttribute("data-act");
if (a === "origin") { S.origin = el.value; save("origin", el.value); S.searched = false; }
else if (a === "city") { S.city = el.value; S.searched = false; }
else if (a === "from") { S.from = el.value; S.searched = false; }
else if (a === "to") { S.to = el.value; S.searched = false; }
else if (a === "kidage") { S.kids[Number(el.getAttribute("data-i"))] = Number(el.value); S.searched = false; }
else if (a === "lang") { S.lang = el.value; save("lang", el.value); }
else if (a === "budget") { S.budget = Number(el.value); S.wheelCity = null; }
else return;
render();
}
document.addEventListener("click", function (e) {
var el = e.target.closest("button[data-act]");
if (el) act(el);
});
document.addEventListener("change", function (e) {
if (e.target.matches("[data-act]")) change(e.target);
});
document.addEventListener("input", function (e) {
if (e.target.matches('input[type=range][data-act="budget"]')) {
S.budget = Number(e.target.value);
var hub = document.querySelector(".hub b"); if (hub) hub.textContent = sym() + S.budget;
}
});
window.__tripwise = { state: S, flightUrl: flightUrl, passengers: passengers, tripDates: tripDates };
render();
})();
</script>
</body>
</html>
