name: Deploy bot (Cloudflare Worker)

# Deploys worker/ to Cloudflare Workers and points the Telegram bot webhook at it.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts, Workers KV Storage, Workers AI: Edit),
#          CLOUDFLARE_ACCOUNT_ID, TG_BOT_TOKEN.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/bot.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TP_TOKEN: ${{ secrets.TP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TG_BOT_TOKEN" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first"; exit 1; fi
      - name: KV namespace
        working-directory: worker
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | python3 -c "import sys,json; print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='tripwise-bot'),''))")
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"tripwise-bot"}' "$API" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          fi
          sed -i "s/KV_ID/$ID/" wrangler.toml
      - name: workers.dev subdomain
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for name in tripwise-hub tripwise-deals tripwise-bot-hub; do
              SUB=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" "$API" | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
              [ -n "$SUB" ] && break
            done
          fi
          [ -n "$SUB" ] || { echo "could not register a workers.dev subdomain"; exit 1; }
          echo "WORKER_URL=https://tripwise-bot.$SUB.workers.dev" >> $GITHUB_ENV
          echo "subdomain: $SUB"
      - name: Deploy
        working-directory: worker
        run: |
          npx --yes wrangler@3.114.0 deploy | tee deploy.log
          printf '%s' "$TG_BOT_TOKEN" | npx --yes wrangler@3.114.0 secret put TG_BOT_TOKEN
          printf '%s' "$TP_TOKEN" | npx --yes wrangler@3.114.0 secret put TP_TOKEN
      - name: Point Telegram webhook to the worker
        working-directory: worker
        run: |
          URL="$WORKER_URL"
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tripwise-bot/subdomain" > /dev/null
          sleep 15
          curl -s "$URL/" ; echo
          SECRET=$(printf '%s' "$TG_BOT_TOKEN" | sha256sum | cut -c1-32)
          curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$URL/tg" -d "secret_token=$SECRET" -d 'allowed_updates=["message","callback_query"]' -d drop_pending_updates=false
          echo
          curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/getWebhookInfo" | python3 -c "import sys,json; d=json.load(sys.stdin)['result']; print(d.get('url','')[:60], d.get('last_error_message',''))"
          mkdir -p ../data && echo "$URL" > ../data/bot_worker.txt
      - name: Save worker URL
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/bot_worker.txt
          git diff --cached --quiet || git commit -m "Bot worker URL"
          git pull --rebase -q && git push -q || true
