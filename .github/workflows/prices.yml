name: Update prices

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates and flight prices
        run: python3 scripts/update_prices.py
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
      - name: Save changes
        run: |
          git config user.name "tripwise-bot"
          git config user.email "tripwise-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update prices and rates" && git push)
