name: Build blog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_blog.py
      - scripts/blog_content.py
      - scripts/blog_guides.json
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: BLOG_OUT=blog python3 scripts/build_blog.py
      - name: Commit
        run: |
          git config user.name "tripwise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog
          git diff --cached --quiet || git commit -m "Rebuild blog"
          git pull --rebase
          git push
